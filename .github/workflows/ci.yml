name: CI

on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - labeled
    - unlabeled
  workflow_dispatch:
    inputs:
      major_release:
        description: Run major-release validation
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - run: npm test
    - run: |
        if [ "${{ (github.event_name == 'workflow_dispatch' && inputs.major_release) || contains(github.event.pull_request.labels.*.name, 'major-release') || startsWith(github.ref, 'refs/tags/') }}" = true ]; then npm run build; else npm run typecheck; fi
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      if: ${{ (github.event_name == 'workflow_dispatch' && inputs.major_release) || contains(github.event.pull_request.labels.*.name, 
        'major-release') || startsWith(github.ref, 'refs/tags/') }}
    - run: npx playwright install --with-deps chromium
      if: ${{ (github.event_name == 'workflow_dispatch' && inputs.major_release) || contains(github.event.pull_request.labels.*.name, 
        'major-release') || startsWith(github.ref, 'refs/tags/') }}
    - run: npm run test:e2e
      if: ${{ (github.event_name == 'workflow_dispatch' && inputs.major_release) || contains(github.event.pull_request.labels.*.name, 
        'major-release') || startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: ${{ ((github.event_name == 'workflow_dispatch' && inputs.major_release) || 
      contains(github.event.pull_request.labels.*.name, 'major-release') || startsWith(github.ref, 'refs/tags/')) && 10 || 2 }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
